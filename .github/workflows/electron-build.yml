name: Electron Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da release, por exemplo v1.7.20'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Electron runtime
        run: npm run runtime:build

      - name: Build Vite
        run: npx vite build --base=./

      - name: Build Electron
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Extract release notes from tag
        run: |
          $tag = "${{ inputs.release_tag || github.ref_name }}"
          git for-each-ref "refs/tags/$tag" --format="%(contents)" | Out-File -FilePath release_notes.md -Encoding utf8

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          body_path: release_notes.md
          files: |
            dist-electron/*.exe
            dist-electron/*.yml
            dist-electron/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
